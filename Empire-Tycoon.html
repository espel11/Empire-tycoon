<script>
const $=s=>document.querySelector(s),rnd=Math.random;
const f=n=>{const a=Math.abs(n),s=n<0?"-$":"$";return s+(a>=1e12?(a/1e12).toFixed(2)+"T":a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(2)+"M":a>=1e4?(a/1e3).toFixed(1)+"K":a.toFixed(a<100?2:0))};
const C={US:["United States",1,1,.25,1],DE:["Germany",.8,1.1,.3,1.1],JP:["Japan",.75,1.05,.28,1.1],BR:["Brazil",.55,.5,.2,.7],IN:["India",.7,.3,.22,.6],CN:["China",.9,.5,.25,.8],AE:["UAE",.5,.9,.05,1]};
// name,cost,revenue/level/day,fixed,unlock net worth,macro sensitivity,mechanic
const IND={food:["Restaurants",100,16,3,0,"g","Low cost, reputation-driven"],retail:["Supermarkets",1200,160,35,1500,"g","Thin margins, scale wins"],realty:["Real estate",6000,500,30,5000,"g","Rent grows with the economy"],tech:["Software",25000,2400,500,2e4,"g","High margin, needs big payroll"],auto:["Car maker",120000,9000,2400,8e4,"s","Hurt by supplier prices"],air:["Airline",6e5,40000,12000,3e5,"f","Fuel is the killer"],energy:["Energy",3e6,2e5,45000,15e5,"e","Profits when fuel spikes"],pharma:["Pharma",12e6,7e5,2e5,6e6,"g","Costly, brand-sensitive"],bank:["Banking",4e7,2e6,4e5,2e7,"r","Loves high interest rates"]};
const ST=[["NVTX","Novatec",120,1.4,0,.03],["AERO","Aerolane",48,1.2,.001,.035],["PETR","Petrolex",64,.6,.002,.02],["MEDI","Medira",90,.8,.001,.025],["BANK","Hanse Bank",55,1,.002,.018],["AUTO","Kōrin Motors",38,1.3,.001,.03],["FOOD","Grocer Group",30,.4,.002,.012],["LUXE","Maison Luxe",210,1.1,.001,.03],["REIT","Skyline REIT",72,.7,.003,.015],["MINE","Terra Mining",26,1.5,.001,.04]];
const AI=[["Vance Holdings",600,.012],["Okafor & Sons",300,.014],["Lindqvist Capital",2e3,.01],["Mei Tanaka Group",900,.013],["Delgado Ventures",150,.017],["Sterling Rowe",5e3,.009],["Nadia Farouk Corp",1200,.012],["Blackwater Trust",8e3,.008]];
const KEY="empire-ledger-v1",N=t=>{S.news.unshift({d:S.day,t});S.news.length=Math.min(S.news.length,40)};
const fresh=()=>({cash:25000,day:1,cos:[],h:{},loan:0,hist:[25000],news:[{d:1,t:"You have $25,000. Open your first business and reinvest every dollar."}],px:Object.fromEntries(ST.map(s=>[s[0],s[2]])),pxh:{},sent:0,m:{g:1,f:1,r:.03},offers:[],ach:{},pm:1,id:1,tab:"dash",rv:AI.map(a=>a[1]),disc:0,sp:1,ts:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||fresh();let LIVE=[],DB=null,ME=null;
const M=k=>({g:S.m.g,f:2-S.m.f,s:2-S.m.f*.7,e:S.m.f,r:.5+S.m.r*15}[k]);
const up$=c=>IND[c.k][1]*.8*Math.pow(c.lv,1.6);
function pl(c){const I=IND[c.k],L=c.locs.map(x=>C[x]),n=L.length,sm=L.reduce((a,x)=>a+x[1],0),aw=L.reduce((a,x)=>a+x[2],0)/n,at=L.reduce((a,x)=>a+x[3],0)/n,ao=L.reduce((a,x)=>a+x[4],0)/n;
const eff=Math.min(1.2,c.st/(2*c.lv*n)),rev=I[2]*c.lv*sm*eff*(.5+c.rep/100)*M(I[5])*S.pm,cost=I[3]*c.lv*n*ao+c.st*I[2]*.06*aw,pr=rev-cost,tax=pr>0?pr*at*(c.pub?1:1):0;
return{rev,cost,tax,net:(pr-tax)*(c.pub?.75:1),eff}}
const val=c=>IND[c.k][1]*c.lv*.7*c.locs.length+Math.max(0,c.pr||0)*110;
const nw=()=>S.cash+S.cos.reduce((a,c)=>a+val(c),0)+Object.entries(S.h).reduce((a,[k,n])=>a+n*S.px[k],0)-S.loan+(window.XA?XA():0);
const unl=()=>Object.keys(IND).filter(k=>nw()>=IND[k][4]);
const EV=[["Global recession: consumer demand collapses",()=>{S.m.g-=.25;S.sent-=4}],["Tech boom lifts every market",()=>{S.m.g+=.2;S.sent+=4}],["Oil shock: fuel prices surge",()=>S.m.f+=.5],["Oil glut: fuel prices tumble",()=>S.m.f-=.3],["Central bank raises interest rates",()=>S.m.r+=.02],["Supplier hikes prices across the auto sector",()=>S.m.f+=.2],
["Viral campaign: one of your brands explodes",()=>{const c=S.cos[S.cos.length*rnd()|0];if(c){c.rep=Math.min(100,c.rep+30)}}],["Employee scandal damages one of your companies",()=>{const c=S.cos[S.cos.length*rnd()|0];if(c)c.rep=Math.max(0,c.rep-25)}],["A new country opens its market: expansion half price for 30 days",()=>S.disc=S.day+30],["Struggling competitor is up for sale",()=>offer()],["Market crash: shares plunge",()=>{S.sent-=8;ST.forEach(s=>S.px[s[0]]*=.85)}],["Bull run: investors pile into equities",()=>{S.sent+=6;ST.forEach(s=>S.px[s[0]]*=1.1)}]];
function offer(){const u=unl(),k=u[u.length*rnd()|0],lv=1+(rnd()*4|0);S.offers.push({k,lv,p:Math.round(IND[k][1]*lv*.9*(.6+rnd()*.6)),nm:["Apex","Nova","Ironwood","Blue Harbor","Redline","Summit"][rnd()*6|0]+" "+IND[k][0],x:S.day+40})}
function tick(){const m=S.m;S.day++;m.g+=(1-m.g)*.03+(rnd()-.5)*.02;m.f+=(1-m.f)*.04+(rnd()-.5)*.05;m.r+=(.03-m.r)*.03+(rnd()-.5)*.002;
m.g=Math.max(.5,Math.min(1.6,m.g));m.f=Math.max(.5,Math.min(2,m.f));m.r=Math.max(.005,Math.min(.12,m.r));S.sent*=.97;
S.cos.forEach(c=>{const p=pl(c);S.cash+=p.net;c.pr=(c.pr||0)*.8+(p.rev-p.cost)*.2;c.rev=p.rev;c.cs=p.cost;c.net=p.net;c.eff=p.eff;c.rep=Math.max(15,c.rep-.05);(c.hist=c.hist||[]).push(p.net);if(c.hist.length>120)c.hist.shift();
if((c.k=="tech"||c.k=="pharma")&&rnd()<.01){c.rep=Math.min(100,c.rep+20);N(c.nm+" announces an R&D breakthrough")}});
ST.forEach(s=>{const k=s[0];S.px[k]=Math.max(1,S.px[k]*(1+(rnd()-.5)*s[5]*2+s[3]*(m.g-1)*.02+S.sent*.003*s[3]));S.cash+=(S.h[k]||0)*S.px[k]*s[4];(S.pxh[k]=S.pxh[k]||[]).push(S.px[k]);if(S.pxh[k].length>60)S.pxh[k].shift()});
if(S.loan>0){const i=S.loan*(m.r+.02)/20;S.cash-=i}
if(S.cash<0&&S.loan>=0){S.loan-=S.cash*1.1;N("Overdraft: the bank covered a shortfall at a penalty");S.cash=0}
S.rv=S.rv.map((w,i)=>w*(1+AI[i][2]*(.4+rnd()*1.2)*(m.g>1?1:.5)));
if(rnd()<.1){const e=EV[EV.length*rnd()|0];e[1]();N(e[0])}
S.offers=S.offers.filter(o=>o.x>S.day);if(rnd()<.03&&S.offers.length<4&&S.cos.length)offer();
const w=nw();S.hist.push(w);if(S.hist.length>300)S.hist.shift();
[["First business",()=>S.cos.length>0],["Ten thousand dollars",()=>w>=1e4],["Go global",()=>S.cos.some(c=>c.locs.length>1)],["Investor",()=>Object.keys(S.h).filter(k=>S.h[k]>0).length>=3],["Public company",()=>S.cos.some(c=>c.pub)],["Conglomerate",()=>S.cos.length>=5],["Millionaire",()=>w>=1e6],["Billionaire",()=>w>=1e9]].forEach(a=>{if(!S.ach[a[0]]&&a[1]()){S.ach[a[0]]=S.day;const r=Math.round(50+w*.01);S.cash+=r;N("Achievement: "+a[0]+" (reward "+f(r)+")")}})}
const A={start(k){const I=IND[k];if(S.cash<I[1]||nw()<I[4])return;S.cash-=I[1];S.cos.push({id:S.id++,k,nm:I[0]+" #"+S.id,lv:1,st:2,rep:30,locs:["US"],pr:0,hist:[],pub:false});N("Founded "+I[0]+" #"+(S.id-1))},
up(i){const c=S.cos[i],p=up$(c);if(S.cash<p)return;S.cash-=p;c.lv++},hire(i,d){const c=S.cos[i],p=IND[c.k][2]*.5;if(d>0){if(S.cash<p)return;S.cash-=p;c.st++}else if(c.st>0)c.st--},
mkt(i){const c=S.cos[i],p=IND[c.k][2]*3*c.lv;if(S.cash<p)return;S.cash-=p;c.rep=Math.min(100,c.rep+15)},
exp(i,cc){const c=S.cos[i],p=IND[c.k][1]*2*c.locs.length*(S.disc>S.day?.5:1);if(S.cash<p||c.locs.includes(cc))return;S.cash-=p;c.locs.push(cc);N(c.nm+" expands to "+C[cc][0])},
ipo(i){const c=S.cos[i],v=val(c);if(c.pub||v<5e4)return;c.pub=true;S.cash+=v*.25;N(c.nm+" goes public, raising "+f(v*.25)+" for 25% of profits")},
sell(i){const c=S.cos[i];S.cash+=val(c)*.9;S.cos.splice(i,1)},buyO(j){const o=S.offers[j];if(S.cash<o.p)return;S.cash-=o.p;S.cos.push({id:S.id++,k:o.k,nm:o.nm,lv:o.lv,st:2*o.lv,rep:40,locs:["US"],pr:0,hist:[],pub:false});S.offers.splice(j,1)},
buy(s,n){const p=S.px[s];n=n=="max"?Math.floor(S.cash/p):n;if(n<1||S.cash<n*p)return;S.cash-=n*p;S.h[s]=(S.h[s]||0)+n},sellS(s,n){const h=S.h[s]||0;n=n=="max"?h:Math.min(n,h);S.cash+=n*S.px[s];S.h[s]=h-n},
loan(p){const m=Math.max(0,nw()*.5-S.loan);const a=Math.min(m,Math.max(100,nw()*p));if(a<=0)return;S.cash+=a;S.loan+=a},repay(){const a=Math.min(S.cash,S.loan);S.cash-=a;S.loan-=a},
tab(t){S.tab=t;R()},pres(){if(nw()<1e6)return;const k=S.ach,r=S.rv,pm=S.pm*1.25,sp=S.sp;S=fresh();S.ach=k;S.rv=r;S.pm=pm;S.sp=sp;N("Prestige: permanent revenue bonus now x"+pm.toFixed(2))},reset(){if(confirm("Delete this save?")){S=fresh();R()}}};
function act(a,...x){A[a](...x);R(1);save()}
const b=(l,a,args,dis,cl)=>`<button class="a ${cl||""}" ${dis?"disabled":""} onclick='act("${a}",${args})'>${l}</button>`;
function R(q){const w=nw(),pr=S.cos.reduce((a,c)=>a+(c.net||0),0);
$("#top").innerHTML=`<div><small>Cash</small><span>${f(S.cash)}</span></div><div><small>Net worth</small><span>${f(w)}</span></div>`;
$("#sp").textContent=S.sp?"Speed "+S.sp+"x":"Paused";
$("#nav").innerHTML=[["dash","Dashboard"],["cos","Companies"],["mkt","Markets"],["world","World"],["rank","Rankings"]].map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick='act("tab","${t[0]}")'>${t[1]}</button>`).join("");
const T={dash(){const m=S.m;return`<div class="g">${[["Growth index",m.g.toFixed(2),m.g>=1],["Fuel index",m.f.toFixed(2),m.f<=1],["Interest rate",(m.r*100).toFixed(1)+"%",1],["Market mood",S.sent>0?"Bullish":S.sent<-2?"Fearful":"Neutral",S.sent>=0]].map(x=>`<div class="c"><span class="mu">${x[0]}</span><h2 class="${x[2]?"up":"dn"}">${x[1]}</h2></div>`).join("")}</div>
<div class="c"><h3>Net worth history</h3><canvas id="cv"></canvas></div><div class="c"><h3>World news</h3>${S.news.slice(0,10).map(n=>`<div class="n"><span class="mu">Day ${n.d}</span> ${n.t}</div>`).join("")}</div>`},
cos(){return`<div class="g">${S.cos.map((c,i)=>{const I=IND[c.k],p=I[2]*.5,mk=I[2]*3*c.lv,ex=I[1]*2*c.locs.length*(S.disc>S.day?.5:1);return`<div class="c"><div class="r"><h3>${c.nm}</h3><span class="tg ${c.pub?"l":""}">${c.pub?"Public":"Private"}</span></div>
<div class="r"><span class="mu">Level ${c.lv} · ${c.locs.length} countr${c.locs.length>1?"ies":"y"}</span><span>Value ${f(val(c))}</span></div>
<div class="r"><span>Revenue ${f(c.rev||0)}</span><span>Costs ${f(c.cs||0)}</span><span class="${(c.net||0)>=0?"up":"dn"}">Net ${f(c.net||0)}</span></div>

<h2>Start a business</h2><div class="g">${Object.keys(IND).map(k=>{const I=IND[k],lk=w<I[4];return`<div class="c"><h3>${I[0]}</h3><span class="mu">${I[6]}</span><div class="r"><span>Cost ${f(I[1])}</span>${lk?`<span class="mu">Unlocks at ${f(I[4])} net worth</span>`:b("Start","start",'"'+k+'"',S.cash<I[1])}</div></div>`}).join("")}</div>`},
